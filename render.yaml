# One-click deploy of the full app (UI + API) on Render's free plan.
# Render → New → Blueprint → pick this repo, then fill in the secret values.
services:
  - type: web
    name: workradar
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_DRAFT_MODEL
        value: gemini-3.5-flash-lite
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOS
        sync: false
      - key: GITHUB_MANAGER
        sync: false
      - key: GITHUB_TEAM
        sync: false
      # Sources page and Google sign-in
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PUBLIC_URL
        sync: false   # e.g. https://workradar.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
# Note: the free plan's disk is wiped on every deploy and restart, so sources
# added on the Sources page and the Google sign-in reset then. GITHUB_* above
# re-seeds the GitHub source. For durable storage, add a Render disk and point
# DATA_DIR at it (paid plans).
